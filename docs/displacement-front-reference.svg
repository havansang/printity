<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600">
  <defs>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="#808080" />

  <!--
    Reference only:
    - Whole canvas stays at neutral 128 gray.
    - Print area does NOT get brighter or darker as a block.
    - Only the folds deviate slightly from 128 gray.
  -->
  <g transform="translate(530 445)">
    <rect width="547" height="707" fill="#808080" />

    <!-- subtle darker folds -->
    <g filter="url(#soften)" opacity="0.35" stroke-linecap="round" fill="none">
      <path d="M125 150 C95 260, 90 380, 140 530 C165 610, 185 660, 195 705" stroke="#767676" stroke-width="28" />
      <path d="M300 120 C285 220, 270 330, 315 455 C345 560, 390 645, 405 705" stroke="#777777" stroke-width="26" />
      <path d="M430 180 C375 250, 360 350, 405 475 C445 575, 470 650, 455 705" stroke="#767676" stroke-width="30" />
    </g>

    <!-- subtle lighter fold ridges -->
    <g filter="url(#soften)" opacity="0.4" stroke-linecap="round" fill="none">
      <path d="M105 155 C130 260, 128 380, 168 525 C188 600, 210 655, 220 700" stroke="#8b8b8b" stroke-width="18" />
      <path d="M325 118 C312 225, 308 338, 348 455 C373 540, 415 635, 430 700" stroke="#8c8c8c" stroke-width="18" />
      <path d="M452 172 C412 250, 400 350, 438 470 C472 565, 495 640, 485 700" stroke="#8c8c8c" stroke-width="18" />
      <path d="M365 585 C315 605, 275 630, 240 670" stroke="#898989" stroke-width="16" />
      <path d="M350 95 C405 90, 455 82, 500 70" stroke="#8a8a8a" stroke-width="15" />
    </g>
  </g>
</svg>
